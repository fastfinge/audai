[project]
name = "audai"
version = "0.1.0"
description = "Endless textless audio continuation experiments (Llama-Mimi, SODA)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",
    "transformers>=4.57",
    "accelerate>=1.9",
    "librosa>=0.11",
    "soundfile>=0.13",
    "numpy",
]

[project.scripts]
audai-continue = "audai.cli:main"
audai-fx = "audai.fx:main"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "openai-whisper>=20250625",
]
